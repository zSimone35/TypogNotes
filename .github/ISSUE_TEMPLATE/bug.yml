name: Report a problem
description: Something is not working as it should
labels: [bug]
body:
  - type: textarea
    id: cosa
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: How to reproduce it
      placeholder: "1. Open a note\n2. Click on…\n3. …"
  - type: input
    id: versione
    attributes:
      label: TypogNotes version
      placeholder: "1.0.0"
  - type: dropdown
    id: tema
    attributes:
      label: Theme
      options: [Light, Dark]
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps to understand.
